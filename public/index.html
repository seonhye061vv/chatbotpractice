<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chatbot</title>
  <style>
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --text: #1d2025; --muted: #6b7280;
      --user: #2563eb; --user-text: #ffffff; --bot: #eef0f3; --border: #e3e6ea;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111316; --panel: #1a1d21; --text: #e7e9ec; --muted: #9aa1ab;
        --user: #3b82f6; --user-text: #ffffff; --bot: #262a30; --border: #2c3036;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      display: flex; justify-content: center;
    }
    .app { width: 100%; max-width: 760px; height: 100dvh; display: flex; flex-direction: column; background: var(--panel); border-inline: 1px solid var(--border); }
    header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 17px; margin: 0; }
    header button { background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; }
    .assistant { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
    .error { align-self: center; color: #dc2626; font-size: 14px; }
    .empty { margin: auto; color: var(--muted); text-align: center; }
    .typing { color: var(--muted); }
    form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
    textarea { flex: 1; resize: none; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; max-height: 160px; }
    form button { background: var(--user); color: var(--user-text); border: 0; border-radius: 10px; padding: 0 18px; font: inherit; cursor: pointer; }
    form button:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>💬 Chatbot</h1>
      <button id="reset" type="button">새 대화</button>
    </header>
    <div id="messages"><p class="empty">무엇이든 물어보세요.</p></div>
    <form id="form">
      <textarea id="input" rows="1" placeholder="메시지를 입력하세요 (Shift+Enter 줄바꿈)" required></textarea>
      <button id="send" type="submit">전송</button>
    </form>
  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    let history = [];

    function addBubble(role, text) {
      messagesEl.querySelector(".empty")?.remove();
      const el = document.createElement("div");
      el.className = `msg ${role}`;
      el.textContent = text;
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return el;
    }

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        form.requestSubmit();
      }
    });
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = input.scrollHeight + "px";
    });

    document.getElementById("reset").addEventListener("click", () => {
      history = [];
      messagesEl.innerHTML = '<p class="empty">무엇이든 물어보세요.</p>';
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || sendBtn.disabled) return;

      input.value = "";
      input.style.height = "auto";
      addBubble("user", text);
      history.push({ role: "user", content: text });

      sendBtn.disabled = true;
      const pending = addBubble("assistant typing", "입력 중…");

      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "요청 실패");
        pending.className = "msg assistant";
        pending.textContent = data.reply;
        history.push({ role: "assistant", content: data.reply });
      } catch (err) {
        pending.remove();
        history.pop();
        addBubble("error", "⚠️ " + err.message);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
